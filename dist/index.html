precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform vec3 uC1, uC2, uC3, uBg;
uniform float uInt;

float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1.0,0.0)), u.x),
             mix(hash(i+vec2(0.0,1.0)), hash(i+vec2(1.0,1.0)), u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 5; i++){ v += a*noise(p); p = m*p; a *= 0.5; }
  return v;
}
// 闪烁星点
vec3 stars(vec2 uv, float t, float amount){
  vec3 col = vec3(0.0);
  float asp = uRes.x/uRes.y;
  for (int i = 0; i < 2; i++){
    float fi = float(i);
    float sc = 90.0 + fi*140.0;
    vec2 g = uv*vec2(asp,1.0)*sc + fi*31.7;
    vec2 id = floor(g); vec2 f = fract(g) - 0.5;
    float h = hash(id + fi*17.0);
    float th = 1.0 - amount;
    if (h > th){
      vec2 o = vec2(hash(id+3.1), hash(id+7.7)) - 0.5;
      float d = length(f - o*0.6);
      float tw = 0.35 + 0.65*(0.5+0.5*sin(t*(1.0+h*3.0) + h*60.0));
      col += vec3(1.0) * smoothstep(0.14, 0.0, d) * tw;
    }
  }
  return col;
}

  <body>
    <div id="stage">
      <div id="imgLayer" hidden></div>
      <canvas id="bg"></canvas>
      <div id="overlays"></div>
    </div>

    <button id="toggle" class="fab" title="设置 (H)">⚙</button>

    <aside id="panel" class="open">
      <header>
        <h1>拍谷背景</h1>
        <div class="actions">
          <button id="btnRandom" title="随机 (R)">🎲 随机</button>
          <button id="btnPause" title="暂停/继续 (空格)">⏸ 暂停</button>
          <button id="btnFull" title="全屏 (F)">⛶ 全屏</button>
          <button id="btnHide" title="隐藏面板 (H)">✕</button>
        </div>
      </header>

      <section>
        <h2>一键场景 <small>← → 切换</small></h2>
        <div id="scenes" class="chips"></div>
      </section>

      <section>
        <h2>配色</h2>
        <div id="palettes" class="swatches"></div>
        <div class="colors">
          <label><input type="color" id="cBg" /><span>背景</span></label>
          <label><input type="color" id="c1" /><span>主色</span></label>
          <label><input type="color" id="c2" /><span>辅色</span></label>
          <label><input type="color" id="c3" /><span>点缀</span></label>
        </div>
        <div class="row">
          <button id="btnFromMain" title="用主色（例如角色应援色）自动生成一套配色">🎨 用主色生成配色</button>
          <button id="btnLightDark" title="背景在深色/浅色之间切换">◐ 深/浅背景</button>
        </div>
      </section>

      <section>
        <h2>背景特效</h2>
        <div id="bgModes" class="grid"></div>
      </section>

      <section id="imgSection">
        <h2>自定义图片 <small>也可以直接拖入或粘贴图片</small></h2>
        <div class="row">
          <label class="btn" for="imgFile">🖼 上传图片</label>
          <input type="file" id="imgFile" accept="image/*" hidden />
          <button id="btnImgPalette" class="needs-img" title="用图片的颜色生成配色，粒子和特效会跟着变">🎨 从图片取色</button>
          <button id="btnImgClear" class="needs-img">🗑 移除</button>
        </div>
        <div id="imgControls" class="needs-img">
          <label class="check"><input type="checkbox" id="imgOn" /> 显示图片</label>
          <label class="check"><input type="checkbox" id="imgMotion" /> 缓慢推拉（让静态图有动感）</label>
          <div class="seg" id="imgFit">
            <span>显示</span><button data-v="cover">铺满</button><button data-v="contain">完整</button><button data-v="tile">平铺</button>
          </div>
          <div class="seg" id="imgBlend">
            <span>特效混合</span><button data-v="screen">发光</button><button data-v="normal">覆盖</button><button data-v="overlay">叠加</button><button data-v="soft-light">柔光</button>
          </div>
          <div class="sliders">
            <label>图片模糊 <input type="range" id="sImgBlur" min="0" max="30" step="1" /><output></output></label>
            <label>图片亮度 <input type="range" id="sImgBright" min="0.3" max="1.5" step="0.05" /><output></output></label>
            <label>背景特效 <input type="range" id="sImgFx" min="0" max="1" step="0.05" /><output></output></label>
          </div>
        </div>
      </section>

      <section>
        <h2>粒子叠加 <small>可多选</small></h2>
        <div id="overlayList" class="grid"></div>
      </section>

      <section class="sliders">
        <h2>调节</h2>
        <label>背景亮度 <input type="range" id="sBright" min="0.2" max="1.8" step="0.05" /><output></output></label>
        <label>背景速度 <input type="range" id="sBgSpeed" min="0" max="3" step="0.05" /><output></output></label>
        <label>粒子数量 <input type="range" id="sDensity" min="0.1" max="3" step="0.05" /><output></output></label>
        <label>粒子速度 <input type="range" id="sSpeed" min="0.1" max="3" step="0.05" /><output></output></label>
        <label>粒子大小 <input type="range" id="sSize" min="0.3" max="3" step="0.05" /><output></output></label>
        <label>粒子透明度 <input type="range" id="sPOpacity" min="0" max="1" step="0.05" /><output></output></label>
        <label>渲染精度 <input type="range" id="sQuality" min="0.3" max="1" step="0.05" /><output></output></label>
      </section>

      <footer>
        <p>快捷键：H 面板 · F 全屏 · 空格 暂停 · R 随机 · ←/→ 场景</p>
        <p>上传的图片只保存在本机浏览器里，不会上传到任何地方。</p>
        <p>闲置 3 秒自动隐藏按钮和鼠标；全屏时尽量保持屏幕常亮。</p>
      </footer>
    </aside>

    <div id="toast"></div>
  </body>
</html>
